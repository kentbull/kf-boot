[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@e60b0c9286225c0d002256552f53a083a62fcf09",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@4895018a9fa2209db8fbd67b7198badf03aad6d2",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@2bb8f844eb141e6da3e12e95d50ec2933161f11d",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@4895018a9fa2209db8fbd67b7198badf03aad6d2",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@2bb8f844eb141e6da3e12e95d50ec2933161f11d",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
