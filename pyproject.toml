[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@7c12050cbf517a2bad0f95695d9c0f33d7025887",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@913ce2445f7dd50d847129e1fec496c0af960fba",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3fd2ba6af326a1bbafb7c19944e665858a56a5ec",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@913ce2445f7dd50d847129e1fec496c0af960fba",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3fd2ba6af326a1bbafb7c19944e665858a56a5ec",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
