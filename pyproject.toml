[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@2b19fa875d8c803c613087102db51b9e07124588",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@f0634584da5a5bd10ddd9208bfee09fa0f49c25f",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3855f05a28e3738aec05569020bfea2050695925",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@f0634584da5a5bd10ddd9208bfee09fa0f49c25f",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3855f05a28e3738aec05569020bfea2050695925",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
