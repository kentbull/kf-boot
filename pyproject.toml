[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@d956ae17a0eb177b536aac3efa09ed5bd34ace11",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@61b2cc54731b26b7442a74cb5b8bfc37fbd61a08",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@ac69c21b4ab1f91a633859a3ea5bdda1a7655701",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@61b2cc54731b26b7442a74cb5b8bfc37fbd61a08",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@ac69c21b4ab1f91a633859a3ea5bdda1a7655701",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
