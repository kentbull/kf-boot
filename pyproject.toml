[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@b01b1324998f0d21c8211659def8b500964fe8db",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@d8826c39ee1c40f5c3b052c36b7b9db9d234780c",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@0b73bcd14822b66b8de64012912b89e719104b93",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@d8826c39ee1c40f5c3b052c36b7b9db9d234780c",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@0b73bcd14822b66b8de64012912b89e719104b93",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
