[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@c5841f30d0d830bad62e0ab91e66d98a0afac20c",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@d51327a90dac9203db35d6ed1f1441d72a40f2ec",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@814890d3a7e692bb0b927a03b5835ad36ba4458b",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@d51327a90dac9203db35d6ed1f1441d72a40f2ec",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@814890d3a7e692bb0b927a03b5835ad36ba4458b",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
