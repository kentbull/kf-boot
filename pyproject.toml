[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kf-boot"
version = "0.0.1"
description = "Minimal KERI Foundation platform service for witness and watcher provisioning"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "falcon>=4.0.2",
    "keri @ git+https://github.com/kentbull/keripy.git@65c80c7773992d7359d308bf2c99b41f693d5cc9",
    "requests>=2.32.3",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@656f73f766af7ab818b5409b5ca5c987eec39df0",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3c7bdacd43aa223221d3d86d154e485cc1c95358",
]
dev = [
    "pytest>=9.0.2",
    "ruff==0.16.2",
    "kf-registrar @ git+https://github.com/kentbull/kf-registrar.git@656f73f766af7ab818b5409b5ca5c987eec39df0",
    "kf-observer @ git+https://github.com/kentbull/kf-observer.git@3c7bdacd43aa223221d3d86d154e485cc1c95358",
]

[project.scripts]
kf-boot = "kfboot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kfboot*"]

[tool.setuptools.package-dir]
"" = "src"
